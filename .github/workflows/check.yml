# 결정의 시대 — 푸시·PR 자동 검사
#
# 왜 있는가
#   로컬 pre-push 훅(.githooks/pre-push)은 그 훅이 설치된 PC 에서만 작동한다. 다른 PC·다른 경로에서
#   올리면 그냥 지나간다 — 2026-09-07 배포 회귀가 정확히 그렇게 일어났다.
#   이 워크플로는 어느 PC 에서 올렸든 GitHub 쪽에서 한 번 더 검사한다. 막지는 못해도, 잘못 나간 것을
#   즉시 빨간불로 알려 준다(3일 동안 모르는 상태를 없애는 것이 목적이다).
#
# 한 가지 구멍 — 반드시 알고 있을 것
#   금칙 스캔([9] 유사성 회귀 가드)이 읽는 ip-banlist.json 은 .gitignore 에 있다.
#   공개 저장소에 금칙어 목록 자체를 올리지 않기 위해서다(QA 검증계획 §2-4-c).
#   그래서 CI 체크아웃에는 그 파일이 없고, 아래 스텝은 [9] 만 건너뛴 채 나머지를 검사한다.
#   → [9] 까지 CI 에서 돌리려면: 저장소 Settings > Secrets and variables > Actions 에
#     IP_BANLIST_JSON 이라는 secret 을 만들고 ip-banlist.json 의 내용을 그대로 붙여넣어라.
#     secret 이 있으면 아래 스텝이 파일을 만들어 주고 [9] 도 정상 실행된다.

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # secret 이 등록돼 있으면 금칙 데이터를 복원한다. 없으면 아무 것도 하지 않는다.
      - name: 금칙 데이터 복원 (secret 이 있을 때만)
        env:
          IP_BANLIST_JSON: ${{ secrets.IP_BANLIST_JSON }}
        run: |
          if [ -n "$IP_BANLIST_JSON" ]; then
            printf '%s' "$IP_BANLIST_JSON" > ip-banlist.json
            echo "ip-banlist.json 복원됨 — [9] 금칙 스캔이 실행된다."
          else
            echo "::warning::IP_BANLIST_JSON secret 이 없어 [9] 유사성 회귀 가드를 건너뛴다. 배포 전 로컬에서 npm run check 를 돌려라."
          fi

      - name: npm run check
        # 파일이 있으면 이 환경변수는 무시된다(스모크가 파일을 먼저 읽는다).
        env:
          HWASIN_BANLIST_OPTIONAL: '1'
        run: npm run check
